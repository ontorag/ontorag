[project]
name = "ontorag"
version = "0.1.5"
description = "Ontology-first RAG: extract a governed knowledge graph from documents and serve it over SPARQL and MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Marco Montanari", email = "sirmmo@gmail.com" }]
keywords = ["rag", "ontology", "knowledge-graph", "rdf", "sparql", "mcp", "llm", "nlp", "semantic-web"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "typer>=0.12.0",
  "requests>=2.31.0",
  "pydantic>=2.0.0",
  "rdflib>=7.0.0",
  "python-dotenv>=1.0.1",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "fastmcp>=0.1.0",
  "mcp>=1.0.0",
  "EbookLib>=0.18",
  "html2text>=2024.2.26",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24.0"]
pageindex = ["pageindex>=0.2.5"]
llamaindex = ["llama-index>=0.10.0"]
docling = ["docling>=2.0.0"]
unstructured = ["unstructured>=0.15.0"]
dev = ["pytest>=8.0", "build>=1.2", "twine>=5.1"]

[project.urls]
Homepage = "https://github.com/ontorag/ontorag"
Repository = "https://github.com/ontorag/ontorag"
Issues = "https://github.com/ontorag/ontorag/issues"

[project.scripts]
ontorag = "ontorag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontorag"]
